name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync (dev extras only, no heavy integrations)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests (offline, no optional extras)
        run: uv run pytest -q

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deutsches_ki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync with the postgres extra
        run: uv sync --extra dev --extra postgres

      - name: Integration tests against real PostgreSQL
        env:
          DEUTSCHES_KI_TEST_DSN: postgresql://postgres:postgres@localhost:5432/deutsches_ki
        run: uv run pytest tests/integration/test_postgres.py -q

  nlp:
    name: spaCy and Presidio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync with the nlp and presidio extras
        run: uv sync --extra dev --extra nlp --extra presidio

      - name: Install the German model
        run: >
          uv pip install
          "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl"

      - name: Integration tests for the detectors
        run: >
          uv run pytest
          tests/integration/test_spacy_detector.py
          tests/integration/test_presidio_detector.py
          -q

  embeddings:
    name: Embeddings and reranking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small-ms-marco-minilm-l6

      - name: Sync with the embeddings extra
        run: uv sync --extra dev --extra embeddings

      - name: Integration tests for embeddings and the cross-encoder
        run: uv run pytest tests/integration/test_embeddings.py -q

  docling:
    name: PDF over Docling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-docling-layout

      - name: Sync with the docling extra
        run: uv sync --extra dev --extra docling

      - name: Integration tests for PDF reading
        run: uv run pytest tests/integration/test_docling.py -q
