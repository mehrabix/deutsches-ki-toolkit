# PostgreSQL mit pgvector, dazu optional Ollama für lokale Antworten.
#
#   docker compose -f docker/compose.yaml up -d postgres
#   docker compose -f docker/compose.yaml --profile local-llm up -d
#
# Wo Docker Hub nicht erreichbar ist, zuerst das eigene Image bauen und die
# Variable setzen:
#
#   docker build -f docker/postgres/Dockerfile -t deutsches-ki-postgres:17 docker/postgres
#   POSTGRES_IMAGE=deutsches-ki-postgres:17 docker compose -f docker/compose.yaml up -d postgres

name: deutsches-ki

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deutsches_ki}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    # Ohne GPU-Profil läuft Ollama auf der CPU. Das ist langsamer, braucht aber
    # keine Grafikkarte.
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["local-llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-gpu:
    # Dasselbe auf einer NVIDIA-Grafikkarte. Braucht den NVIDIA-Treiber und
    # nvidia-container-toolkit auf dem Wirtsrechner.
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["local-llm-gpu"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres-data:
  ollama-data:
