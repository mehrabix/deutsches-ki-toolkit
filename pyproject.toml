[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deutsches-ki-toolkit"
version = "0.5.0"
description = "Deutschsprachige KI-Infrastruktur für Dokumente, Datenschutz, Suche und RAG."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "mehrabix" }]
keywords = [
    "german",
    "nlp",
    "pii",
    "rag",
    "retrieval",
    "documents",
    "privacy",
    "deutsch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "spacy-lookups-data>=1.0",
]
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
gliner = [
    "gliner>=0.2",
    # Beide fehlen in Gliners eigenen Abhängigkeiten. Ohne tiktoken scheitert
    # das Laden des Tokenizers, ohne protobuf das Lesen des SentencePiece-Modells
    # (die Fehlermeldung nennt dann irreführend eine Zeile in spm.model).
    "tiktoken>=0.7",
    "protobuf>=5.0",
]
docling = [
    "docling>=2.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
mcp = [
    "mcp>=1.0",
]
demo = [
    "gradio>=4.0",
]
all = [
    "deutsches-ki-toolkit[nlp,presidio,gliner,docling,embeddings,postgres,mcp,demo]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
deutsches-ki = "deutsches_ki.cli.main:app"
deutsches-ki-mcp = "deutsches_ki.mcp.server:main"

[project.urls]
Homepage = "https://github.com/mehrabix/deutsches-ki-toolkit"
Issues = "https://github.com/mehrabix/deutsches-ki-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deutsches_ki"]

[tool.hatch.build.targets.sdist]
include = ["src/deutsches_ki", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["spacy.*", "presidio_analyzer.*", "presidio_anonymizer.*", "gliner.*", "docling.*", "sentence_transformers.*", "torch.*", "pgvector.*", "psycopg.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that exercise several modules together",
    "optional: tests that need an optional extra installed",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/deutsches_ki"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
